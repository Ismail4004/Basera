{% comment %}
  The header cart link. It has an id so a cart change can swap it out of band
  (HTMX) and keep the badge and the screen-reader label in step. Pass oob=1
  when including it in a fragment.
{% endcomment %}
<a id="cart-link" class="bt-icon-link" href="{% url 'cart' %}"
   aria-label="Cart{% if cart_count %}: {{ cart_count }} plant{{ cart_count|pluralize }}{% endif %}"
   {% if oob %}hx-swap-oob="true"{% endif %}>
  <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
  {% if cart_count %}<span class="bt-badge">{{ cart_count }}</span>{% endif %}
</a>
